name: Build Tongpin Clean

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Test server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/server/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and test server
        run: npm test

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle -p apps/android assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: tongpin-clean-1.3.1-public-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
